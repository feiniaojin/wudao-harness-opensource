<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>3D 黑洞引力模拟器</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #020408;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  .hud {
    position: fixed; top: 14px; left: 14px; z-index: 10;
    color: #9fb4c7; font: 12px/1.7 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    background: rgba(8, 14, 22, 0.72); border: 1px solid rgba(120, 160, 200, 0.22);
    border-radius: 8px; padding: 8px 12px; backdrop-filter: blur(6px);
    pointer-events: none; white-space: pre;
  }
  .hud b { color: #ffd9a0; font-weight: 600; }

  .panel {
    position: fixed; top: 14px; right: 14px; z-index: 10; width: 250px;
    color: #cfe3f5; font-size: 13px;
    background: rgba(8, 14, 22, 0.82); border: 1px solid rgba(120, 160, 200, 0.25);
    border-radius: 12px; padding: 14px 16px 12px; backdrop-filter: blur(8px);
    user-select: none;
  }
  .panel-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; color: #fff; }
  .panel label.row { display: block; margin: 8px 0; }
  .panel label.row b { float: right; color: #ffd9a0; font-weight: 600; }
  .panel input[type=range] { width: 100%; accent-color: #e07b39; margin-top: 3px; cursor: pointer; }
  .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 8px; margin: 10px 0; }
  .toggles label { display: flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; }
  .toggles input { accent-color: #e07b39; cursor: pointer; }
  .buttons { display: flex; gap: 8px; }
  .buttons button {
    flex: 1; padding: 7px 0; border-radius: 8px; cursor: pointer; font-size: 13px;
    color: #eaf4ff; background: rgba(224, 123, 57, 0.16);
    border: 1px solid rgba(224, 123, 57, 0.5);
  }
  .buttons button:hover { background: rgba(224, 123, 57, 0.32); }
  .buttons button:active { transform: translateY(1px); }
  .hint { margin-top: 10px; font-size: 11px; color: #6f87a0; }

  #err {
    position: fixed; inset: 0; z-index: 99; display: none;
    align-items: center; justify-content: center; text-align: center;
    background: #020408; color: #ffb3a0; font-size: 15px; line-height: 2; padding: 20px;
  }
  #err code { color: #ffd9a0; background: rgba(255,255,255,0.08); padding: 1px 6px; border-radius: 4px; }
</style>
</head>
<body>

<div id="app"></div>

<div class="hud" id="hud"></div>

<div class="panel" id="panel">
  <div class="panel-title">🕳 黑洞引力模拟器</div>
  <label class="row">粒子数 <b id="v-n"></b>
    <input id="c-n" type="range" min="2000" max="30000" step="1000" value="12000">
  </label>
  <label class="row">黑洞质量 M <b id="v-m"></b>
    <input id="c-m" type="range" min="0.3" max="1.5" step="0.05" value="0.6">
  </label>
  <label class="row">时间流速 <b id="v-t"></b>
    <input id="c-t" type="range" min="0.25" max="6" step="0.25" value="1.5">
  </label>
  <div class="toggles">
    <label><input id="c-trails" type="checkbox" checked> 轨道尾迹</label>
    <label><input id="c-doppler" type="checkbox" checked> 多普勒着色</label>
    <label><input id="c-ring" type="checkbox" checked> 光子环</label>
    <label><input id="c-rot" type="checkbox" checked> 自动旋转</label>
  </div>
  <div class="buttons">
    <button id="b-pause">⏸ 暂停</button>
    <button id="b-step">⏭ 单步</button>
    <button id="b-reset">⟳ 重置</button>
  </div>
  <div class="hint">拖拽旋转 · 滚轮缩放 · 空格暂停</div>
</div>

<div id="err"></div>

<!-- ============ 纯物理内核（不依赖 THREE / DOM，可被脚本提取验证） ============ -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script>
/*__PHYSICS_BEGIN__*/
/* 单位制：G = 1, c = 1。黑洞质量 M ⇒ 视界半径 Rs = 2M，光子球 = 1.5Rs，ISCO = 3Rs。
   积分器：速度 Verlet（中心力场下角动量精确守恒）。 */
globalThis.BHPhysics = (function () {
  'use strict';

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function createState(n) {
    return {
      n: n,
      pos: new Float32Array(n * 3),
      vel: new Float32Array(n * 3),
      alive: new Uint8Array(n),
      swallowed: 0
    };
  }

  function orbitalSpeed(GM, r) { return Math.sqrt(GM / r); }
  function photonRadius(Rs)    { return 1.5 * Rs; }
  function isco(Rs)            { return 3 * Rs; }

  function randomDir(rand, twoPi) {
    const u = rand() * 2 - 1;
    const th = rand() * twoPi;
    const s = Math.sqrt(1 - u * u);
    return [s * Math.cos(th), u, s * Math.sin(th)];
  }

  /* 初始条件：吸积盘(86%) + 倾斜晕族(8%) + 内落流(6%) */
  function initDisk(state, seed, GM, Rs) {
    const n = state.n, pos = state.pos, vel = state.vel, alive = state.alive;
    const rand = mulberry32(seed);
    const twoPi = Math.PI * 2;
    const inner = 2.7 * Rs, outer = 12 * Rs;

    for (let i = 0; i < n; i++) {
      const i3 = i * 3;
      const roll = rand();
      let x, y, z, vx, vy, vz;

      if (roll < 0.86) {
        /* 吸积盘：近开普勒圆轨道，半径分布偏向内缘，垂向呈喇叭状展开 */
        const r = inner + (outer - inner) * Math.pow(rand(), 1.5);
        const th = rand() * twoPi;
        const flare = 0.45 + 0.30 * (r / Rs);
        y = flare * (rand() + rand() + rand() - 1.5);
        x = r * Math.cos(th);
        z = r * Math.sin(th);
        const v = orbitalSpeed(GM, r) * (0.985 + 0.05 * rand());
        vx = -v * Math.sin(th);
        vz =  v * Math.cos(th);
        vy = 0;
      } else if (roll < 0.94) {
        /* 晕族：随机轨道面 + 略椭圆轨道，提供 3D 纵深 */
        const r = inner * 0.9 + (outer - inner) * rand();
        const d = randomDir(rand, twoPi);
        let axis = randomDir(rand, twoPi);
        // 保证轨道面法线与位置不平行
        let cxx = d[1] * axis[2] - d[2] * axis[1];
        let cyy = d[2] * axis[0] - d[0] * axis[2];
        let czz = d[0] * axis[1] - d[1] * axis[0];
        let cl = Math.sqrt(cxx * cxx + cyy * cyy + czz * czz);
        while (cl < 0.15) {
          axis = randomDir(rand, twoPi);
          cxx = d[1] * axis[2] - d[2] * axis[1];
          cyy = d[2] * axis[0] - d[0] * axis[2];
          czz = d[0] * axis[1] - d[1] * axis[0];
          cl = Math.sqrt(cxx * cxx + cyy * cyy + czz * czz);
        }
        x = r * d[0]; y = r * d[1]; z = r * d[2];
        const v = orbitalSpeed(GM, r) * (0.55 + 0.65 * rand());
        vx = (cxx / cl) * v; vy = (cyy / cl) * v; vz = (czz / cl) * v;
      } else {
        /* 内落流：3 条从外盘俯冲而入的扇形流，制造吸积漏斗 */
        const sIdx = Math.floor(rand() * 3);
        const base = (sIdx / 3) * twoPi + rand() * 0.30;
        const r = 6 * Rs + (14 * Rs) * rand();
        const th = base + (rand() - 0.5) * 0.30;
        x = r * Math.cos(th);
        z = r * Math.sin(th);
        y = (rand() - 0.5) * 1.2 * Rs;
        const vk = orbitalSpeed(GM, r);
        const erx =  Math.cos(th), erz = Math.sin(th);
        const etx = -Math.sin(th), etz =  Math.cos(th);
        vx = etx * vk * 0.30 - erx * vk * 0.55;
        vz = etz * vk * 0.30 - erz * vk * 0.55;
        vy = (rand() - 0.5) * vk * 0.15;
      }

      pos[i3] = x; pos[i3 + 1] = y; pos[i3 + 2] = z;
      vel[i3] = vx; vel[i3 + 1] = vy; vel[i3 + 2] = vz;
      alive[i] = 1;
    }
  }

  /* 速度 Verlet 推进一步；越过视界 (r < Rs) 的粒子被吞噬。
     返回本次吞噬数量。软化长度 eps = 0.4Rs 避免奇点发散。 */
  function step(state, dt, GM, Rs) {
    const n = state.n, pos = state.pos, vel = state.vel, alive = state.alive;
    const Rs2 = Rs * Rs;
    const eps2 = 0.16 * Rs * Rs;      // (0.4Rs)^2
    const dt2 = dt * 0.5;
    let swallowed = 0;

    for (let i = 0; i < n; i++) {
      if (!alive[i]) continue;
      const i3 = i * 3;

      const x0 = pos[i3],     y0 = pos[i3 + 1], z0 = pos[i3 + 2];
      const r20 = x0 * x0 + y0 * y0 + z0 * z0 + eps2;
      const inv0 = 1 / (r20 * Math.sqrt(r20));   // 1 / r^3
      const k0 = GM * inv0;
      const vx1 = vel[i3]     + (-k0 * x0) * dt2;
      const vy1 = vel[i3 + 1] + (-k0 * y0) * dt2;
      const vz1 = vel[i3 + 2] + (-k0 * z0) * dt2;
      const x1 = x0 + vx1 * dt;
      const y1 = y0 + vy1 * dt;
      const z1 = z0 + vz1 * dt;

      const r21 = x1 * x1 + y1 * y1 + z1 * z1 + eps2;
      const inv1 = 1 / (r21 * Math.sqrt(r21));
      const k1 = GM * inv1;

      vel[i3]     = vx1 + (-k1 * x1) * dt2;
      vel[i3 + 1] = vy1 + (-k1 * y1) * dt2;
      vel[i3 + 2] = vz1 + (-k1 * z1) * dt2;
      pos[i3]     = x1; pos[i3 + 1] = y1; pos[i3 + 2] = z1;

      if (x1 * x1 + y1 * y1 + z1 * z1 < Rs2) { alive[i] = 0; swallowed++; }
    }
    state.swallowed += swallowed;
    return swallowed;
  }

  return { createState, initDisk, step, orbitalSpeed, photonRadius, isco, mulberry32 };
})();
/*__PHYSICS_END__*/
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const P = globalThis.BHPhysics;

/* ---------------- 参数 ---------------- */
const params = {
  M: 0.6, n: 12000, seed: 20240814,
  timeScale: 1.5, paused: false,
  showTrails: true, doppler: true, autoRotate: true, photonRing: true
};
let GM = params.M, Rs = 2 * params.M;
let state = null;
let colArr = null;

const N_TRAIL = 42, TRAIL_LEN = 96, BASE_DT = 0.016;

/* ---------------- 渲染器 / 场景 / 相机 ---------------- */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020408);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 600);
camera.position.set(17, 13, 27);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 140;
controls.autoRotateSpeed = 0.5;

/* ---------------- 纹理工具 ---------------- */
function radialTexture(stops, size = 128) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (const [off, col] of stops) g.addColorStop(off, col);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const pointTex = radialTexture([[0, '#ffffff'], [0.35, 'rgba(255,240,210,0.85)'], [1, 'rgba(255,255,255,0)']]);
const starTex  = radialTexture([[0, '#ffffff'], [0.5, 'rgba(210,225,255,0.8)'], [1, 'rgba(255,255,255,0)']], 64);
const glowTex  = radialTexture([[0, 'rgba(255,240,220,1)'], [0.35, 'rgba(255,160,70,0.5)'], [1, 'rgba(255,90,20,0)']]);
const flashTex = radialTexture([[0, '#ffffff'], [0.4, 'rgba(255,200,120,0.9)'], [1, 'rgba(255,120,40,0)']]);

/* ---------------- 星场背景 ---------------- */
(function buildStars() {
  const n = 1600;
  const pos = new Float32Array(n * 3);
  const col = new Float32Array(n * 3);
  const rand = P.mulberry32(7);
  for (let i = 0; i < n; i++) {
    const d = randomDir(rand);
    const r = 90 + rand() * 200;
    pos[i * 3] = d[0] * r; pos[i * 3 + 1] = d[1] * r; pos[i * 3 + 2] = d[2] * r;
    const b = 0.5 + rand() * 0.5;
    col[i * 3] = b; col[i * 3 + 1] = b; col[i * 3 + 2] = b * (0.9 + rand() * 0.1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const m = new THREE.PointsMaterial({
    size: 1.6, map: starTex, vertexColors: true, transparent: true,
    depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: false
  });
  const stars = new THREE.Points(g, m);
  stars.renderOrder = -10;
  scene.add(stars);
})();

function randomDir(rand) {
  const u = rand() * 2 - 1, th = rand() * Math.PI * 2, s = Math.sqrt(1 - u * u);
  return [s * Math.cos(th), u, s * Math.sin(th)];
}

/* ---------------- 黑洞视觉（随 M 重建） ---------------- */
const bhGroup = new THREE.Group();
scene.add(bhGroup);
let bhSphere, bhRim, photonRing, lensGlow, diskHaze;

function rebuildBHVision() {
  bhGroup.clear();
  const phR = P.photonRadius(Rs);
  const inner = 2.7 * Rs, outer = 12 * Rs;

  // 事件视界：不透明黑球（产生阴影轮廓）
  bhSphere = new THREE.Mesh(
    new THREE.SphereGeometry(Rs, 48, 48),
    new THREE.MeshBasicMaterial({ color: 0x000000 })
  );
  bhGroup.add(bhSphere);

  // 菲涅尔边缘微光
  bhRim = new THREE.Mesh(
    new THREE.SphereGeometry(Rs * 1.05, 48, 48),
    new THREE.ShaderMaterial({
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
      vertexShader: `
        varying vec3 vN; varying vec3 vV;
        void main(){
          vN = normalize(normalMatrix * normal);
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          vV = normalize(-mv.xyz);
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: `
        varying vec3 vN; varying vec3 vV;
        void main(){
          float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 2.5);
          gl_FragColor = vec4(vec3(1.0, 0.85, 0.6) * f * 0.55, f);
        }`
    })
  );
  bhGroup.add(bhRim);

  // 光子环（billboard 圆环，面向相机）
  photonRing = new THREE.Mesh(
    new THREE.RingGeometry(phR * 0.5, phR * 2.4, 96),
    new THREE.ShaderMaterial({
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
      uniforms: { uInner: { value: phR }, uTime: { value: 0 } },
      vertexShader: `
        varying vec2 vPos;
        void main(){ vPos = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform float uInner; uniform float uTime;
        varying vec2 vPos;
        void main(){
          float d = length(vPos);
          float ring   = exp(-pow((d - uInner) * 5.0, 2.0));          // 主亮环
          float innerH = exp(-pow((d - uInner * 0.55) * 6.0, 2.0)) * 0.35; // 内侧暗弱辉光
          float flicker = 0.92 + 0.08 * sin(uTime * 3.0 + d * 24.0);
          vec3 col = vec3(1.0, 0.86, 0.62);
          gl_FragColor = vec4(col * (ring * 1.5 + innerH) * flicker, 1.0);
        }`
    })
  );
  photonRing.renderOrder = 3;
  bhGroup.add(photonRing);

  // 引力透镜辉光（大而柔和的暖光晕）
  lensGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, transparent: true, opacity: 0.4,
    depthWrite: false, blending: THREE.AdditiveBlending
  }));
  lensGlow.scale.setScalar(7.5 * Rs);
  lensGlow.renderOrder = -3;
  bhGroup.add(lensGlow);

  // 吸积盘暖雾（XZ 平面上的低透明度径向渐变环）
  diskHaze = new THREE.Mesh(
    new THREE.RingGeometry(inner, outer, 128),
    new THREE.ShaderMaterial({
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
      uniforms: { uInner: { value: inner }, uOuter: { value: outer }, uTime: { value: 0 } },
      vertexShader: `
        varying vec3 vPos;
        void main(){ vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform float uInner; uniform float uOuter; uniform float uTime;
        varying vec3 vPos;
        void main(){
          float d = length(vPos.xz);
          float t = (d - uInner) / (uOuter - uInner);
          float a = exp(-pow((t - 0.18) * 1.6, 2.0)) * 0.16 * (0.9 + 0.1 * sin(uTime * 1.5));
          gl_FragColor = vec4(vec3(1.0, 0.55, 0.25) * a, a);
        }`
    })
  );
  diskHaze.rotation.x = -Math.PI / 2;
  diskHaze.renderOrder = -2;
  bhGroup.add(diskHaze);
}
rebuildBHVision();

/* ---------------- 粒子云 ---------------- */
let points = null, colorAttr = null;

function buildPoints() {
  if (points) { scene.remove(points); points.geometry.dispose(); points.material.dispose(); }
  const n = state.n;
  colArr = new Float32Array(n * 3);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(state.pos, 3).setUsage(THREE.DynamicDrawUsage));
  colorAttr = new THREE.BufferAttribute(colArr, 3).setUsage(THREE.DynamicDrawUsage);
  g.setAttribute('color', colorAttr);
  const m = new THREE.PointsMaterial({
    size: 0.34, map: pointTex, vertexColors: true, transparent: true,
    depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
  });
  points = new THREE.Points(g, m);
  points.frustumCulled = false;
  scene.add(points);
}

/* ---------------- 轨道尾迹 ---------------- */
const trailObjs = [], trailHist = [], trailHead = [];

function buildTrails() {
  for (const o of trailObjs) { scene.remove(o); o.geometry.dispose(); o.material.dispose(); }
  trailObjs.length = 0; trailHist.length = 0; trailHead.length = 0;
  for (let t = 0; t < N_TRAIL; t++) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TRAIL_LEN * 3), 3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(TRAIL_LEN * 3), 3).setUsage(THREE.DynamicDrawUsage));
    const line = new THREE.Line(g, new THREE.LineBasicMaterial({
      vertexColors: true, transparent: true, opacity: 1,
      depthWrite: false, blending: THREE.AdditiveBlending
    }));
    line.frustumCulled = false;
    line.renderOrder = 1;
    scene.add(line);
    trailObjs.push(line);
    trailHist.push(new Float32Array(TRAIL_LEN * 3));
    trailHead.push(0);
  }
}

/* ---------------- 吞噬闪光池 ---------------- */
const FLASH_N = 24;
const flashes = [];
(function buildFlashes() {
  for (let i = 0; i < FLASH_N; i++) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map: flashTex, transparent: true, opacity: 0, depthWrite: false,
      blending: THREE.AdditiveBlending
    }));
    sp.renderOrder = 4;
    sp.visible = false;
    scene.add(sp);
    flashes.push({ sprite: sp, life: 0, maxLife: 0.6 });
  }
})();

/* ---------------- 颜色（温度 + 多普勒） ---------------- */
const STOPS = [
  [1.00, 0.98, 0.92],
  [0.78, 0.86, 1.00],
  [1.00, 0.72, 0.45],
  [0.85, 0.35, 0.16],
  [0.38, 0.13, 0.10]
];
const BLUE = [0.45, 0.70, 1.00], RED = [1.00, 0.30, 0.12];

function updateColors() {
  const n = state.n, pos = state.pos, vel = state.vel, alive = state.alive;
  const rHot = 2.2 * Rs, span = Math.max(1e-6, 8 * Rs - rHot);
  const useDoppler = params.doppler;
  for (let i = 0; i < n; i++) {
    const i3 = i * 3;
    if (!alive[i]) { colArr[i3] = colArr[i3 + 1] = colArr[i3 + 2] = 0; continue; }
    const x = pos[i3], y = pos[i3 + 1], z = pos[i3 + 2];
    const r = Math.sqrt(x * x + y * y + z * z);
    let t = (r - rHot) / span;
    if (t < 0) t = 0; else if (t > 1) t = 1;
    const f = t * (STOPS.length - 1), i0 = f | 0, i1 = Math.min(i0 + 1, STOPS.length - 1), w = f - i0;
    let cr = STOPS[i0][0] + (STOPS[i1][0] - STOPS[i0][0]) * w;
    let cg = STOPS[i0][1] + (STOPS[i1][1] - STOPS[i0][1]) * w;
    let cb = STOPS[i0][2] + (STOPS[i1][2] - STOPS[i0][2]) * w;

    if (useDoppler) {
      const vr = (vel[i3] * x + vel[i3 + 1] * y + vel[i3 + 2] * z) / r; // c=1
      const s = Math.max(-1, Math.min(1, vr));
      const wgt = Math.min(1, Math.abs(s) * 1.6) * 0.55;
      const tr = s < 0 ? BLUE[0] : RED[0], tg = s < 0 ? BLUE[1] : RED[1], tb = s < 0 ? BLUE[2] : RED[2];
      cr += (tr - cr) * wgt; cg += (tg - cg) * wgt; cb += (tb - cb) * wgt;
    }
    colArr[i3] = cr; colArr[i3 + 1] = cg; colArr[i3 + 2] = cb;
  }
  colorAttr.needsUpdate = true;
}

/* ---------------- 尾迹更新 ---------------- */
function updateTrails() {
  if (!params.showTrails) return;
  for (let t = 0; t < N_TRAIL; t++) {
    const i3 = t * 3;
    if (!state.alive[t]) continue;
    const h = trailHist[t], hp = trailHead[t];
    h[hp * 3] = state.pos[i3]; h[hp * 3 + 1] = state.pos[i3 + 1]; h[hp * 3 + 2] = state.pos[i3 + 2];
    trailHead[t] = (hp + 1) % TRAIL_LEN;
    const g = trailObjs[t].geometry;
    const gp = g.attributes.position.array, gc = g.attributes.color.array;
    const cr = colArr[i3], cg = colArr[i3 + 1], cb = colArr[i3 + 2];
    for (let k = 0; k < TRAIL_LEN; k++) {
      const src = (hp - k + TRAIL_LEN) % TRAIL_LEN;
      const s3 = src * 3, d3 = k * 3;
      gp[d3] = h[s3]; gp[d3 + 1] = h[s3 + 1]; gp[d3 + 2] = h[s3 + 2];
      const fade = Math.pow(1 - k / TRAIL_LEN, 1.6);
      gc[d3] = cr * fade; gc[d3 + 1] = cg * fade; gc[d3 + 2] = cb * fade;
    }
    g.attributes.position.needsUpdate = true;
    g.attributes.color.needsUpdate = true;
  }
}

/* ---------------- 吞噬闪光 ---------------- */
let flashCursor = 0;
function spawnFlash(x, y, z) {
  const f = flashes[flashCursor];
  flashCursor = (flashCursor + 1) % FLASH_N;
  f.sprite.position.set(x, y, z);
  f.life = f.maxLife;
  f.sprite.visible = true;
}
function updateFlashes(dt) {
  for (const f of flashes) {
    if (f.life <= 0) { f.sprite.visible = false; continue; }
    f.life -= dt;
    const p = Math.max(0, f.life / f.maxLife);
    f.sprite.scale.setScalar(1.2 + (1 - p) * 6);
    f.sprite.material.opacity = p * 0.95;
    f.sprite.material.rotation += dt * 3;
  }
}

/* ---------------- 模拟核心 ---------------- */
let swallowedTotal = 0;
const DM = 2e-6; // 每颗被吞噬粒子的质量占比

function initSim() {
  state = P.createState(params.n);
  P.initDisk(state, params.seed, GM, Rs);
  swallowedTotal = 0;
  buildPoints();
  buildTrails();
  for (const f of flashes) { f.life = 0; f.sprite.visible = false; }
}

function physicsTick() {
  const sub = Math.max(1, Math.round(params.timeScale));
  const dt = BASE_DT * params.timeScale / sub;
  let sw = 0;
  for (let s = 0; s < sub; s++) sw += P.step(state, dt, GM, Rs);
  if (sw > 0) {
    swallowedTotal += sw;
    // 黑洞吸积：质量缓慢增长，视界随之扩张
    const nM = params.M + sw * DM;
    setMass(nM);
    let cap = Math.min(sw, 12), k = 0;
    for (let i = 0; i < state.n && k < cap; i++) {
      const i3 = i * 3;
      if (!state.alive[i]) {
        spawnFlash(state.pos[i3], state.pos[i3 + 1], state.pos[i3 + 2]);
        k++;
      }
    }
  }
}

function setMass(m) {
  params.M = m;
  GM = m;
  Rs = 2 * m;
  rebuildBHVision();
}

/* ---------------- HUD ---------------- */
const hudEl = document.getElementById('hud');
let hudTimer = 0, frames = 0, fps = 0;
function updateHUD(dt) {
  frames++;
  hudTimer += dt;
  if (hudTimer < 0.25) return;
  fps = frames / hudTimer;
  frames = 0; hudTimer = 0;
  let alive = 0;
  for (let i = 0; i < state.n; i++) alive += state.alive[i];
  hudEl.innerHTML =
    `FPS    <b>${fps.toFixed(0)}</b>\n` +
    `粒子   <b>${alive.toLocaleString()}</b> / ${state.n.toLocaleString()}\n` +
    `吞噬   <b>${swallowedTotal.toLocaleString()}</b>\n` +
    `质量 M <b>${params.M.toFixed(4)}</b>  R_s=${Rs.toFixed(3)}`;
}

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (!params.paused) physicsTick();

  updateColors();
  updateTrails();
  updateFlashes(dt);

  if (params.photonRing) {
    photonRing.quaternion.copy(camera.quaternion);
    photonRing.material.uniforms.uTime.value = clock.elapsedTime;
    photonRing.visible = true;
  } else photonRing.visible = false;
  diskHaze.material.uniforms.uTime.value = clock.elapsedTime;

  controls.autoRotate = params.autoRotate;
  controls.update();
  updateHUD(dt);
  renderer.render(scene, camera);
}

/* ---------------- 控件 ---------------- */
const $ = (id) => document.getElementById(id);
const vN = $('v-n'), vM = $('v-m'), vT = $('v-t');
function syncLabels() {
  vN.textContent = params.n.toLocaleString();
  vM.textContent = params.M.toFixed(2);
  vT.textContent = params.timeScale.toFixed(2) + '×';
}
syncLabels();

$('c-n').addEventListener('input', (e) => { params.n = +e.target.value; syncLabels(); });
$('c-n').addEventListener('change', () => { params.seed = (Math.random() * 2 ** 31) | 0; initSim(); });
$('c-m').addEventListener('input', (e) => {
  setMass(+e.target.value);
  syncLabels();
});
$('c-t').addEventListener('input', (e) => { params.timeScale = +e.target.value; syncLabels(); });
$('c-trails').addEventListener('change', (e) => {
  params.showTrails = e.target.checked;
  for (const o of trailObjs) o.visible = params.showTrails;
});
$('c-doppler').addEventListener('change', (e) => { params.doppler = e.target.checked; });
$('c-ring').addEventListener('change', (e) => { params.photonRing = e.target.checked; });
$('c-rot').addEventListener('change', (e) => { params.autoRotate = e.target.checked; });

const pauseBtn = $('b-pause');
function setPaused(p) {
  params.paused = p;
  pauseBtn.textContent = p ? '▶ 继续' : '⏸ 暂停';
}
$('b-pause').addEventListener('click', () => setPaused(!params.paused));
$('b-step').addEventListener('click', () => { setPaused(true); physicsTick(); });
$('b-reset').addEventListener('click', () => {
  params.seed = (Math.random() * 2 ** 31) | 0;
  initSim();
});
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); setPaused(!params.paused); }
});
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------------- 错误提示（离线时 CDN 加载失败） ---------------- */
window.addEventListener('error', (e) => {
  const errEl = $('err');
  errEl.style.display = 'flex';
  errEl.innerHTML =
    `⚠️ 加载失败：<code>${e.message}</code><br>` +
    `模拟器依赖 CDN 上的 Three.js。请联网后刷新，<br>` +
    `或本地起一个静态服务：<code>python3 -m http.server</code> 后访问 8000 端口。`;
}, { capture: true });

/* ---------------- 启动 ---------------- */
initSim();
setPaused(false);
animate();
</script>
</body>
</html>
