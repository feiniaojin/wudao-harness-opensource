[package]
name = "wudao-harness-desktop"
version = "0.5.10"
description = "wudao ui desktop shell — spawns the wudao-server sidecar and hosts the web UI"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# M76-ux2 §7: macos-private-api pairs with app.macOSPrivateApi in
# tauri.conf.json (the native menu-bar area / overlay title bar). Plain
# cargo builds need the feature explicitly — only the tauri CLI auto-adds
# it from the conf.
# ω99-100: tray-icon enables tauri::tray (TrayIconBuilder) — the summon-back
# menu once windows hide; the feature flag is the tray's entire Cargo-side
# footprint (menu items come from tauri::menu, already in).
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
# M76-ux2 §4 + M77 §1: the two guest-facing plugins the web UI calls through
# the withGlobalTauri invoke bridge — notification (agent-finish) and dialog
# (workspace directory picker). The capabilities files already pin their
# permissions (dialog:allow-open, notification:default); without the crates
# those capability entries fail the build (and the features no-op at runtime).
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# ω99-110: the selection hotkey (⌥⌘E → AX-read the focused app's selection →
# the pet's intake card). Deliberately the arc's ONLY new crate (brief §1's
# dependency ruling): hotkey event-loop integration with the macOS event
# system is the genuinely dangerous part to hand-roll (Carbon RegisterEventHit
# test/retention semantics), so the OFFICIAL plugin earns its slot; the AX
# read itself stays zero-crate hand-rolled FFI (src/selection.rs).
tauri-plugin-global-shortcut = "2"
serde_json = "1"
# 2026-09-12 收口：单实例锁（两次「小精灵又没了」均在重装后自愈 → 运行态
# 劣化/多实例互踩是病根家族，重装=清进程）。第二实例 → 唤起已有实例主窗
# → 自退。官方插件（macOS 上 NSApplicationDelegate 层），零手写 FFI。
tauri-plugin-single-instance = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
