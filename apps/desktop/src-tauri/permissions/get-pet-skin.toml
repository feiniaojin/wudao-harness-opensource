# ω99-111 — the pet's mount-time skin query: read pet-skin.json (a registry
# id, normalized to "default" on missing/corrupt/unknown) so the webview can
# render the persisted skin on first paint. Same remote-origin rule as
# read-dropped-file.toml: the pet webview runs on the sidecar's
# http://127.0.0.1 origin, which tauri's ACL treats as REMOTE — remote
# content can never reach an app command without an explicit capability
# (referenced by capabilities/pet.json).
[[permission]]
identifier = "allow-get-pet-skin"
description = "Allows the pet window to read the persisted pet skin id (pet-skin.json, normalized to a registry id)."
commands.allow = ["get_pet_skin"]
