# ω99-196 — the pet window's layout command: morph the window between
# compact (104×71, hugs the sprite — the click-eating dead rect above the
# pet is gone), bubble (220×320, the conf size for input/ask/hint forms),
# and answer (360×440, the widened reading form). The resize reanchors on
# the window's bottom-center, so the sprite never moves visually. Same
# remote-origin rule as get-pet-skin.toml (the ω99-111 precedent): the pet
# webview runs on the sidecar's http://127.0.0.1 origin, which tauri's ACL
# treats as REMOTE — remote content can never reach an app command without
# an explicit capability.
#
# Referenced by capabilities/pet.json ONLY (the pet window is the sole
# caller; main.json/drag.json carry no entry). The command fail-closes on
# unknown modes and a missing window (set_pet_layout in main.rs), and the
# geometry it accepts is a closed three-value set — no scope entries needed.
[[permission]]
identifier = "allow-set-pet-layout"
description = "Allows the pet window to morph its layout (compact/bubble/answer; bottom-center anchored, sprite position preserved)."
commands.allow = ["set_pet_layout"]
