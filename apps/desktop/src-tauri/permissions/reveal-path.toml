# ω99-125 — the deliverable file card's ONE command: reveal a finished
# make_xlsx/make_pptx artifact in Finder (`open -R`). Same remote-origin
# rule as read-dropped-file (the ω99-104 precedent): both webviews run on
# the sidecar's http://127.0.0.1 origin, which tauri's ACL treats as
# REMOTE — an app command is dead without an explicit capability.
#
# Referenced by capabilities/main.json ONLY (the main window's activity
# card owns the button; the pet window never invokes it — no entry in
# pet.json/drag.json). The command itself gates on on-disk existence
# (fs::metadata — a URL string is not on disk and is refused) and passes
# args as an array (no shell), so no scope entries are needed.
[[permission]]
identifier = "allow-reveal-path"
description = "Allows revealing a delivered artifact file in Finder (existence-gated, no data returned)."
commands.allow = ["reveal_path"]
