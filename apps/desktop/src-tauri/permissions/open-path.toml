# ω99-129 — the deliverable file card's SECOND command: open a finished
# make_xlsx/make_pptx/make_docx artifact with the DEFAULT application
# (bare `open`, no -R — the make_pdf ruling's system pipeline: the user
# ⌘P-saves to PDF from Word/Numbers with the OS's embedded fonts). Same
# remote-origin rule as reveal-path (the ω99-104 precedent): both webviews
# run on the sidecar's http://127.0.0.1 origin, which tauri's ACL treats
# as REMOTE — an app command is dead without an explicit capability.
#
# Referenced by capabilities/main.json ONLY (the main window's activity
# card owns the button; the pet window never invokes it — no entry in
# pet.json/drag.json). The command itself gates on on-disk existence
# (fs::metadata — a URL string is not on disk and is refused) and passes
# args as an array (no shell), so no scope entries are needed.
[[permission]]
identifier = "allow-open-path"
description = "Allows opening a delivered artifact file with the default application (existence-gated, opens with the default application, no data returned)."
commands.allow = ["open_path"]
