# M58 §C#9 — example workflow for the wudao-harness GitHub Action (see
# /action.yml at the repo root and the README "CI usage" section).
#
# Manual dispatch only: it spends real tokens and needs a provider key in
# WUDAO_AGENT_KEY. For other repos, reference the published action instead:
#
#   - uses: feiniaojin/wudao-harness@v0.2.0   # or a commit SHA
#     with:
#       prompt: "Review the diff and list correctness risks"
#       provider: deepseek
#       api-key: ${{ secrets.DEEPSEEK_API_KEY }}
#       extra-flags: "--read-only"
#
# In THIS repo the action is local (repo root), so the same call is `uses: ./`.
name: wudao agent (manual demo)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: The prompt for the one-shot run
        required: true
        default: "Summarize the repo layout and list the three riskiest files."
      provider:
        description: deepseek | glm | qwen | wudao
        required: false
        default: deepseek
      extra-flags:
        description: Extra CLI flags (e.g. "--read-only", "--auto")
        required: false
        default: "--read-only"

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The action builds the harness from this checkout, then runs the
      # one-shot CLI on it (sessions land under .wudao/sessions/).
      - uses: ./
        with:
          prompt: ${{ github.event.inputs.prompt }}
          provider: ${{ github.event.inputs.provider }}
          extra-flags: ${{ github.event.inputs.extra-flags }}
          api-key: ${{ secrets.WUDAO_AGENT_KEY }}
