name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.4.14)"
        required: true
        default: "0.4.14"

jobs:
  # ── Build & test ─────────────────────────────────────────────
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Billing: macOS meters at 10x, Windows at 2x. The per-push CI
        # workflow already runs the full test suite on ubuntu; release runs
        # tests once on the cheapest runner and spends mac/windows only on
        # their platform packaging jobs.
        os: [ubuntu-latest]
        node: [22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test

      # Upload CLI package artifact (from ubuntu — same for all platforms)
      - if: matrix.os == 'ubuntu-latest'
        name: Pack CLI npm package
        run: |
          cd packages/cli
          pnpm pack --pack-destination ../../dist

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: npm-package
          path: dist/*.tgz

  # ── macOS desktop app (.dmg) ─────────────────────────────────
  desktop-macos:
    runs-on: macos-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Build web frontend
        run: pnpm --filter @wudao-org/web build

      - name: Build desktop app (SEA sidecar + click helper + tauri bundle)
        # desktop:build = build-sea.mjs (server sidecar per triple, darwin
        # produces BOTH aarch64 + x86_64 for the universal dmg) followed by
        # tauri-build.mjs (universal target + the swift click helper). The raw
        # `tauri build` cannot work alone: externalBin expects the sidecar.
        run: pnpm --filter @wudao-org/desktop run desktop:build
        env:
          # The SEA build needs the Node.js binary
          NODE_SEA_CWD: ${{ github.workspace }}

      - name: Upload macOS dmg
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # ── Linux desktop app (.AppImage + .deb) ─────────────────────
  desktop-linux:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Build web frontend
        run: pnpm --filter @wudao-org/web build

      - name: Build desktop app (SEA sidecar + tauri bundle)
        run: pnpm --filter @wudao-org/desktop run desktop:build
        continue-on-error: true  # Desktop on Linux is best-effort

      - name: Upload Linux packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb

  # ── Windows desktop app (.exe NSIS installer) ────────────────
  desktop-windows:
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm build
      - name: Build web frontend
        run: pnpm --filter @wudao-org/web build
      - name: Build desktop app (SEA sidecar + tauri NSIS bundle)
        run: pnpm --filter @wudao-org/desktop run desktop:build
        # 0.4.21 首航曾用 continue-on-error 掩盖真实失败：构建步红、job 绿、
        # 无 exe、Release 页缺 Windows 包而无人知。Windows 包是发布的一等
        # 公民（用户令）——失败必须红得可见。
      - name: Diagnostics (pwsh) — bundle dir + pnpm shim 原文
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "apps\desktop\src-tauri\target\release\bundle") { Get-ChildItem -Recurse "apps\desktop\src-tauri\target\release\bundle" | Select-Object -ExpandProperty FullName } else { "no bundle dir" }
          "--- PNPM_HOME ($env:PNPM_HOME) ---"
          if (Test-Path $env:PNPM_HOME) { Get-ChildItem $env:PNPM_HOME | Select-Object -ExpandProperty Name }
          if (Test-Path "$env:PNPM_HOME\pnpm.CMD") { "--- pnpm.CMD ---"; Get-Content "$env:PNPM_HOME\pnpm.CMD" }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  # ── Publish to npm ────────────────────────────────────────────
  # 六包已正式上 npm（@wudao-org/* + wudao-harness）。CI 发布=同一仪式的自动
  # 化：版本已在（手工先发过）时 409/403 冲突由 continue-on-error 吸收——
  # 绝不让 npm 段挡住安装包上 release 页。
  publish-npm:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish all six packages
        run: pnpm -r --filter './packages/*' publish --access public --registry=https://registry.npmjs.org/ --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Create GitHub Release with all artifacts ──────────────────
  release:
    runs-on: ubuntu-latest
    needs: [build, desktop-macos, desktop-linux, desktop-windows]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    # Even if desktop builds fail, still create a release
    continue-on-error: true
    # The default token is read-only — creating the Release needs contents:write.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "*.tgz" -exec cp {} release/ \;
          find artifacts -name "*.dmg" -exec cp {} release/ \;
          find artifacts -name "*.AppImage" -exec cp {} release/ \;
          find artifacts -name "*.deb" -exec cp {} release/ \;
          find artifacts -name "*.exe" -exec cp {} release/ \;
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          shasum -a 256 * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          # tag_name is REQUIRED on workflow_dispatch (a branch ref carries no
          # tag — without this the action silently skips creating anything).
          # On a tag push both spellings resolve to the same tag.
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          files: |
            release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true  # re-running a version overwrites its assets instead of colliding
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
