name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.4.14)"
        required: true
        default: "0.4.14"

jobs:
  # ── Build & test ─────────────────────────────────────────────
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Billing: macOS meters at 10x, Windows at 2x. The per-push CI
        # workflow already runs the full test suite on ubuntu; release runs
        # tests once on the cheapest runner and spends mac/windows only on
        # their platform packaging jobs.
        os: [ubuntu-latest]
        node: [22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test
        continue-on-error: ${{ matrix.os == 'windows-latest' }}  # Windows tests may have platform differences

      # Upload CLI package artifact (from ubuntu — same for all platforms)
      - if: matrix.os == 'ubuntu-latest'
        name: Pack CLI npm package
        run: |
          cd packages/cli
          npm pack
          mkdir -p ../../dist
          cp wudao-harness-*.tgz ../../dist/

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: npm-package
          path: dist/*.tgz

  # ── macOS desktop app (.dmg) ─────────────────────────────────
  desktop-macos:
    runs-on: macos-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Build web frontend
        run: pnpm --filter @wudao-org/web build

      - name: Build desktop app (SEA sidecar + click helper + tauri bundle)
        # desktop:build = build-sea.mjs (server sidecar per triple, darwin
        # produces BOTH aarch64 + x86_64 for the universal dmg) followed by
        # tauri-build.mjs (universal target + the swift click helper). The raw
        # `tauri build` cannot work alone: externalBin expects the sidecar.
        run: pnpm --filter @wudao-org/desktop run desktop:build
        env:
          # The SEA build needs the Node.js binary
          NODE_SEA_CWD: ${{ github.workspace }}

      - name: Upload macOS dmg
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # ── Linux desktop app (.AppImage + .deb) ─────────────────────
  desktop-linux:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Build web frontend
        run: pnpm --filter @wudao-org/web build

      - name: Build desktop app (SEA sidecar + tauri bundle)
        run: pnpm --filter @wudao-org/desktop run desktop:build
        continue-on-error: true  # Desktop on Linux is best-effort

      - name: Upload Linux packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb

  # ── Windows desktop app (.exe NSIS installer) ────────────────
  desktop-windows:
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm build
      - name: Build web frontend
        run: pnpm --filter @wudao-org/web build
      - name: Build desktop app (SEA sidecar + tauri NSIS bundle)
        run: pnpm --filter @wudao-org/desktop run desktop:build
        continue-on-error: true  # Windows desktop is best-effort until first verified ship
      - name: Upload Windows installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  # ── Publish to npm ────────────────────────────────────────────
  publish-npm:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The workspace deps (@wudao/*) are not on npm — the publishable form is
      # the verified single-file bundle: esbuild inlines the workspace graph,
      # keeps the native/ESM-external deps (ink/react/node-pty/…) as declared
      # dependencies, and the createRequire banner lets the CJS deps (ws etc.)
      # require node builtins inside the ESM bundle (the exact recipe verified
      # by a local `npm install -g` round-trip on 0.4.14).
      - name: Bundle CLI (single-file, workspace deps inlined)
        run: |
          mkdir -p bundle-out
          node node_modules/.pnpm/esbuild@*/node_modules/esbuild/bin/esbuild packages/cli/dist/index.js \
            --bundle --platform=node --format=esm \
            --external:ink --external:react --external:node-pty --external:cli-highlight \
            --external:grok-mermaid --external:better-sqlite3 --external:sharp \
            --external:fsevents --external:chromium-bidi --external:playwright \
            '--banner:js=import { createRequire as __cr } from "node:module"; const require = __cr(import.meta.url);' \
            --outfile=bundle-out/index.js
          node -e '
            const fs = require("node:fs");
            const m = JSON.parse(fs.readFileSync("packages/cli/package.json", "utf8"));
            const out = {
              name: m.name, version: m.version, description: m.description, license: m.license,
              type: "module", bin: { wudao: "./index.js" },
              dependencies: Object.fromEntries(Object.entries(m.dependencies).filter(([k]) => !k.startsWith("@wudao/"))),
              engines: m.engines,
            };
            fs.writeFileSync("bundle-out/package.json", JSON.stringify(out, null, 2));
          '
          chmod +x bundle-out/index.js
      - name: Publish CLI to npm
        run: |
          cd bundle-out
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true  # Don't fail the release if npm publish fails

  # ── Create GitHub Release with all artifacts ──────────────────
  release:
    runs-on: ubuntu-latest
    needs: [build, desktop-macos, desktop-linux]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    # Even if desktop builds fail, still create a release
    continue-on-error: true
    # The default token is read-only — creating the Release needs contents:write.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "*.tgz" -exec cp {} release/ \;
          find artifacts -name "*.dmg" -exec cp {} release/ \;
          find artifacts -name "*.AppImage" -exec cp {} release/ \;
          find artifacts -name "*.deb" -exec cp {} release/ \
          find artifacts -name "*.exe" -exec cp {} release/ \;
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          shasum -a 256 * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          # tag_name is REQUIRED on workflow_dispatch (a branch ref carries no
          # tag — without this the action silently skips creating anything).
          # On a tag push both spellings resolve to the same tag.
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          files: |
            release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true  # re-running a version overwrites its assets instead of colliding
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
